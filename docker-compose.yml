services:
  postgres:
    image: postgres:17-alpine
    container_name: ligo-cash-in-postgres
    environment:
      POSTGRES_DB: ligo_cash_in
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d ligo_cash_in"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
